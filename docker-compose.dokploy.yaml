# Dokploy deployment: builds the image from this fork's source.
# Domain/HTTPS is configured in Dokploy (service: rails, port: 3000).
# Environment variables are defined in Dokploy's Environment tab (written to .env).

x-app-env: &app-env
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker

services:
  rails:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: chatwoot-fork:latest
    env_file: .env
    environment: *app-env
    entrypoint: docker/entrypoints/rails.sh
    command: ['sh', '-c', 'bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0']
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres
      - redis
    restart: always

  sidekiq:
    # Reuses the image built by the rails service instead of building twice.
    image: chatwoot-fork:latest
    pull_policy: never
    env_file: .env
    environment: *app-env
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - storage_data:/app/storage
    depends_on:
      - rails
      - postgres
      - redis
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - redis_data:/data
    restart: always

volumes:
  storage_data:
  postgres_data:
  redis_data:
